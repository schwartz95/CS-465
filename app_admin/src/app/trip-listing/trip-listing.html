<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Trips</h2>
  <button class="btn btn-primary" type="button" (click)="addTrip()">Add Trip</button>
</div>

<div class="row">
  <div *ngFor="let trip of trips()" class="col-3">
    <app-trip-card [trip]="trip" (tripDeleted)="loadTrips()" class="card-deck mt-2"></app-trip-card>
  </div>
</div>
