<div class="row">
  <div class="col-md-6">
    <h2>Login</h2>

    <div
      *ngIf="formError"
      class="alert alert-danger"
      role="alert">
      {{ formError }}
    </div>

    <form (ngSubmit)="onLoginSubmit()">
      <div class="form-group">
        <label for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          class="form-control"
          [(ngModel)]="credentials.email"
          required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          class="form-control"
          [(ngModel)]="credentials.password"
          required>
      </div>

      <button type="submit" class="btn btn-primary">
        Log In
      </button>
    </form>
  </div>
</div>
